<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poly99</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><polygon points='50,12 88,50 70,88 30,78 12,42' fill='%2300ffff'/></svg>">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function() { console.log.apply(console, arguments); },
            printErr: function() { console.error.apply(console, arguments); },
            setStatus: function(text) {
                if (text) console.log('[status] ' + text);
            }
        };
        Module.canvas.addEventListener('mousedown', function() { this.focus(); });
        Module.canvas.focus();
        window.onerror = function(message, source, line, col) {
            console.error('[error] ' + message + ' (' + source + ':' + line + ':' + col + ')');
        };
    </script>
    <script async type="text/javascript" src="index.js"></script>
</body>
</html>
