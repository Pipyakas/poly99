; Windows / NVIDIA (L1, Zephyrus G15, RTX 3070 Mobile).
;
; UE reads Config/{PLATFORM}/ as a later config layer than Config/DefaultEngine.ini, so every
; value here overrides the shared file on Windows only. See the "Platform Extensions" table in
; Engine/Source/Runtime/Core/Public/Misc/ConfigHierarchy.h.

[SystemSettings]
; 1 = DLSS. The DLSS plugin does build for this target, so the RTX 3070 gets its upscaler -
; this is the setting the Linux override has to turn off. The project ships NVIDIA DLSS 8.8.0
; and the plugin is already listed in Poly99Game.uproject.
r.TemporalAA.Upscaler=1
r.NGX.DLSS.Enable=1
; Max < 100 on purpose: at 100% the DLSS plugin picks DLAA, whose NGX feature cannot follow
; dynamic-res changes and asserts in NGXD3D12RHI.cpp:431 (editor crash 2026-10-13).
; 50-70% = DLSS Perf..Quality. The Linux override can go to 100 because TSR has no DLAA.
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=70