[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=poly99+
CompanyName=Pipyakas

; The cook commandlet treats "Asset manager settings do not include an entry for assets of type
; GameFeatureData" as a fatal error and exits 1 after cooking (every package cooks fine, nothing is
; staged). An interactive -game run only logs it, which is why it went unnoticed until packaging.
; This is the standard entry Epic generates for a project with no GameFeature content. It is not
; platform-specific: this project mounts 243 built-in game-feature plugins, so the GameFeatures
; plugin loads on Windows as well as Linux and the cook would fail there too.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

; The Pixel Streaming 2 encoder settings are Linux-only and live in Config/Linux/DefaultGame.ini:
; they exist because D1's RX 6700 XT has no H.264/H.265 hardware encoder, so software VP9 is the
; only option there. L1's RTX 3070 has NVENC and does not need them. PixelStreaming2 and
; LibVpxCodecs are listed in Poly99Game.uproject so the plugin loads on both platforms; only the
; tuned values differ.