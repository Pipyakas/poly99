[SystemSettings]
; 1440p @ 120 Hz target: dynamic resolution + a temporal upscaler.
; The upscaler and the dynamic-res range both differ per GPU, so the two that actually vary are
; set in Config/{Platform}/DefaultEngine.ini (Linux = TSR + 10-100%, Windows = DLSS + 50-70%).
; FrameTimeBudget 8.33 ms is exactly 120 Hz (1000/120) and is shared.
;
; Why the ranges differ: on Windows the DLSS plugin picks DLAA at 100%, whose NGX feature
; cannot follow dynamic-res changes and asserts in NGXD3D12RHI.cpp:431 (editor crash
; 2026-10-13), hence the <100 cap. TSR has no such constraint. The project-local DLSS plugin
; is also patched to never pick DLAA while r.DynamicRes.OperationMode!=0
; (Plugins/DLSS/Source/DLSS/Private/DLSSUpscaler.cpp, search "poly99"), which does not cover
; the first -game frames.
;
; r.TemporalAA.Upscaler: 0 = TSR, 1 = DLSS.
; r.NGX.DLSS.Enable: 1 where the DLSS plugin is actually compiled for the target.
r.Editor.Viewport.OverridePIEScreenPercentage=0
r.DynamicRes.OperationMode=2
r.DynamicRes.FrameTimeBudget=8.33

