; Linux / AMD (D1, RX 6700 XT, Mesa 26.2.4 radeonsi).
;
; UE reads Config/{PLATFORM}/ as a later config layer than Config/DefaultEngine.ini, so every
; value here overrides the shared file on Linux only. See the "Platform Extensions" table in
; Engine/Source/Runtime/Core/Public/Misc/ConfigHierarchy.h.

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; UE 5.8 BaseEngine.ini targets only SF_VULKAN_SM5 on Linux. Per
; Engine/Config/VulkanPC/DataDrivenPlatformInfo.ini, VULKAN_SM5 sets bSupportsRayTracing=false and
; bSupportsNanite=false, so without this the engine turns hardware RT and Nanite off here.
; (Lumen GI itself also runs on SM5; Virtual Shadow Maps are gated on Nanite, not on ray tracing.)
; Mirrors the SM6-only intent of the WindowsTargetPlatform section in DefaultEngine.ini.
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.RendererSettings]
; 3 = TSR. This was 4 (MSAA), which is not temporal and therefore does nothing about sub-pixel
; shimmer on thin geometry. Combined with r.TemporalAA.Upscaler=1 the frame had NO temporal
; filtering at all: MSAA is geometric-only, and the upscaler it pointed at (DLSS) is not built
; for this platform - the game log says "LogDLSSBlueprint: DLSS is not supported on this
; platform at build time" and r.NGX.DLSS.Enable is created as a "dummy variable".
; The Windows override sets this back to 4 alongside DLSS.
r.AntiAliasingMethod=3

[SystemSettings]
; 0 = TSR. DLSS is not compiled for the Linux target, so selecting it produced no upscaler at
; all. See Config/Windows/DefaultEngine.ini for the NVIDIA values.
r.TemporalAA.Upscaler=0
r.NGX.DLSS.Enable=0
; 10-100 is the full range: dynamic res drops internal resolution under load and climbs back to
; native when it can, rather than being pinned near half scale. TSR has no DLAA-style constraint
; at 100%, which is why the Windows override caps at 70.
r.DynamicRes.MinScreenPercentage=10
r.DynamicRes.MaxScreenPercentage=100

[ConsoleVariables]
; UE 5.8 Vulkan compute PSO precaching aborts on Mesa/RADV with
;   "ACO ERROR: Unimplemented intrinsic instr: @store_deref"
; and the process dies with SIGABRT at startup - a packaged Shipping build never reaches
; its first frame. Root cause is UE-side: ShaderPrint emits SPIR-V that stores to
; OpTypeImage/OpTypeSampler, which the Vulkan spec forbids, leaving ACO no legal lowering.
; Mesa's Rhys Perry traced it to ShaderPrint with a project-independent DXC repro; Epic
; tracks a fix for 5.9. Known to hit Steam Deck, Navi 32 and Navi 22 on Mesa 26.x alike.
; Precaching is an optimisation, not a correctness requirement, so turning it off is safe.
; Remove this once the engine is on 5.9+. Not wanted on Windows, where precaching works.
r.PSOPrecaching=0