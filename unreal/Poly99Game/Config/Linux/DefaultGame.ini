; Linux / AMD (D1, RX 6700 XT).
;
; UE reads Config/{PLATFORM}/ as a later config layer than Config/DefaultGame.ini, so these values
; apply on Linux only. See the "Platform Extensions" table in
; Engine/Source/Runtime/Core/Public/Misc/ConfigHierarchy.h.

; Pixel Streaming 2 defaults to H264, and D1 has no H264 encoder: UE 5.8 ships AVCodecs backends
; for AMF, NVCodecs, VTCodecs and WMFCodecs only. AMF is gated to Windows/Android/Apple
; (AMF_DLL_NAMEA) and VTCodecs/WMFCodecs have no Linux target, so the only Linux encoders left
; are NVCodecs (NVENC - the RTX 2060, deliberately unused) and the software VP8/VP9 in
; LibVpxCodecs. Codec=VP9 selects the software encoder, so the RX 6700 XT only has to do
; rendering and Vulkan. L1's RTX 3070 has NVENC and needs none of this.
;
; AutoStartStream is deliberately NOT set: streaming should be something the run command opts
; into, not something every launch of the game does.
[/Script/PixelStreaming2Settings.PixelStreaming2PluginSettings]
Codec=VP9
; LAN quality profile. These MUST live in the ini, not on the command line. Passing
; -PixelStreamingEncoderMinQuality=100 etc. does set the CVar, and the log confirms it
; ("from command line"), but ~48s later, when the streamer initialises, PS2 re-syncs every
; CVar from the settings UPROPERTY and the command-line values are gone:
;   LogPixelStreaming2Settings: Setting CVar [PixelStreaming2.Encoder.MinQuality] to [0]
;   ... [WebRTC.MaxBitrate] to [40000000]
; The ini sets the property itself, so it survives the sync. Expect the same for any
; future PS2 tuning - verify against the re-sync block in the log, not the cmdline block.
;
; D1 and L1 are wired at 1 Gb/s (L1 also has WiFi 6), so do not cap. Encoder quality is
; 0-100 with 100 = best; pinning MinQuality to MaxQuality stops the encoder adapting
; downward. For a weak uplink, lower WebRTCMaxBitrate and drop MinQuality to ~50.
EncoderMinQuality=100
EncoderMaxQuality=100
EncoderLatencyMode=UltraLowLatency
WebRTCStartBitrate=100000000
WebRTCMinBitrate=100000000
WebRTCMaxBitrate=300000000
; Shipped default is "AV1,H264,VP9,VP8". AV1 and H264 have no encoder on this machine so
; VP9 is what actually gets chosen, but list it first rather than relying on that.
WebRTCCodecPreferences=VP9,VP8